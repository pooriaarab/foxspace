<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ChatGPT</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>What can I help with?</h1>
<form class="composer" onsubmit="return false"><div contenteditable="true" translate="no" class="ProseMirror" id="prompt-textarea" role="textbox"><p><br></p></div>
<button class="send" data-testid="send-button" aria-label="Send prompt" type="button">&#8593;</button></form><ol id="sent"></ol></main>
<script type="module">import { chat } from "/editor.js"; chat({ composer: "#prompt-textarea", send: '[data-testid="send-button"]' });</script>
</body></html>
