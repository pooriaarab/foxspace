<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>foxspace picker</title><link rel="stylesheet" href="style.css"></head>
<body class="frame">
  <header><img class="mark" src="icons/icon-48.png" alt="" width="20" height="20"><h1 id="title">Add a space</h1><button id="close" class="ghost small" type="button" aria-label="Close">Close</button></header>
  <label class="field-label" for="space">Space</label>
  <select id="space"></select>
  <ul id="items" class="plain picks"></ul>
  <p id="left" class="note"></p>
  <pre id="preview" aria-label="What goes into the message box"></pre>
  <div class="bar"><button id="insert" class="primary" type="button">Insert</button><button id="copy" type="button">Copy</button><span id="count" class="note"></span></div>
  <p id="status" class="status" role="status"></p>
  <script src="picker.js"></script>
</body>
</html>
