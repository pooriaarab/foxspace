<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>foxspace guard</title><link rel="stylesheet" href="style.css"></head>
<body class="frame guard">
  <header><img class="mark" src="icons/icon-48.png" alt="" width="20" height="20"><h1>foxspace stopped this message</h1></header>
  <p id="why" class="note">It holds a term you chose never to share:</p>
  <ul id="terms" class="plain terms"></ul>
  <div class="bar"><button id="edit" class="primary" type="button">Edit</button><button id="send" class="danger" type="button">Send anyway</button></div>
  <p id="status" class="status" role="status"></p>
  <script src="guard.js"></script>
</body>
</html>
